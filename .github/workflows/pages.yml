name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Сборки нет: игра — это статические файлы (HTML/CSS/ES-модули).
      # Кладём в _site только то, что нужно в браузере.
      - name: Собрать статику
        run: |
          mkdir -p _site
          cp -r index.html styles.css src assets _site/
          # .nojekyll — чтобы GitHub Pages не трогал файлы с подчёркиванием
          touch _site/.nojekyll
          echo "Файлов в сборке: $(find _site -type f | wc -l)"
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
